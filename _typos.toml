[files]
extend-exclude = [
  "pnpm-lock.yaml",
  # generated by git-cliff; its commit hashes read as typos (562baed as "based")
  "CHANGELOG.md",
  "dist/",
  # C++ native code: variable names and upstream OGDF API
  "scripts/layout-lab/native/",
]

[default.extend-words]
# Level of detail — the rendering term the agent-docs file is named for, which
# typos reads as a misspelling of LOAD.
LOD = "LOD"
# From `mis-anchors` in gfaParser's note on rGFA stable names that contain
# colons. Scoped as narrowly as the tool allows; it is one hyphenated compound,
# and rewording correct prose to satisfy a spellchecker is the wrong trade.
mis = "mis"
# Genome assembly names: panTro (Pan troglodytes), gorGor (Gorilla gorilla), etc.
# Typos detects "Tro" as a substring and flags it; mark it as correct.
Tro = "Tro"
# PNG is Portable Network Graphics. Typos treats "PN" substring as wrong.
PN = "PN"
# Commit hashes — treat as correct to avoid flagging partial hashes
ba = "ba"
# Test field names and data structure identifiers
STRUC = "STRUC"
REPID = "REPID"
# Intentional misspelling in test case checking that misspellings are rejected
Reigon = "Reigon"
# vg's graph alignment format
GAM = "GAM"
# E. coli's thr operon genes (thrL, thrA) in the reference tests
thr = "thr"
