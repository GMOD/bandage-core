name: gfa-to-tabix
description:
  Puts on PATH the gfa-to-tabix release src/foldParity.test.ts holds
  foldVariants to
runs:
  using: composite
  steps:
    - name: Install gfa-to-tabix
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        VERSION: v0.10.0
        SHA256: 7a0f4616da6d6d0e312f18e9038feb34d29ef35e11bdb52e1ade4e8d258d3829
      run: |
        asset=gfa-to-tabix-x86_64-unknown-linux-musl
        curl -fsSLO "https://github.com/GMOD/gfa-to-tabix/releases/download/$VERSION/$asset.tar.gz"
        echo "$SHA256  $asset.tar.gz" | sha256sum -c
        tar -xzf "$asset.tar.gz"
        echo "$RUNNER_TEMP/$asset" >> "$GITHUB_PATH"
