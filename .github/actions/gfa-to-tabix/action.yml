name: gfa-to-tabix
description:
  Puts on PATH the gfa-to-tabix commit src/foldParity.test.ts holds foldVariants
  to
runs:
  using: composite
  steps:
    - name: Install gfa-to-tabix
      shell: bash
      env:
        REV: 1e77ad6c0d3f642c581f1bc9e60d0e656d15df7e
      run: |
        cargo install --locked --git https://github.com/GMOD/gfa-to-tabix --rev "$REV" --root "$RUNNER_TEMP/gfa-to-tabix"
        echo "$RUNNER_TEMP/gfa-to-tabix/bin" >> "$GITHUB_PATH"
