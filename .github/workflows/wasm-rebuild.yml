name: Rebuild Bandage engine

# Proves src/bandage/bandage-layout.js is still reproducible from the C++ it
# claims to come from — the point of vendoring it rather than fetching an opaque
# blob. Not run per-push: OGDF is a multi-minute compile.
#
# Requires the SINGLE_FILE option in BandageNG-web's bandage-layout-js/
# CMakeLists.txt, so push that change before enabling this.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      bandage-ref:
        description: BandageNG-web ref to build from
        default: bandage-layout-js

jobs:
  rebuild:
    name: Rebuild from source and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: plugin
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: cmdcolin/BandageNG-web
          ref: ${{ inputs.bandage-ref || 'bandage-layout-js' }}
          path: BandageNG
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x

      # OGDF dominates the build; its output only changes when that vendored
      # tree does, so key the cache on it
      - name: Cache OGDF wasm build
        uses: actions/cache@v4
        with:
          path: BandageNG/thirdparty/ogdf/build-wasm
          key: ogdf-wasm-${{ hashFiles('BandageNG/thirdparty/ogdf/**/CMakeLists.txt') }}

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Rebuild
        working-directory: plugin
        run: BANDAGE_DIR="$GITHUB_WORKSPACE/BandageNG" ./scripts/build-wasm.sh

      # Emscripten output is not byte-reproducible (it embeds paths and toolchain
      # version), so compare behaviour and size rather than bytes.
      - name: Smoke test the rebuilt engine
        working-directory: plugin
        run: node scripts/smoke-wasm.mjs

      - name: Report drift against the committed artifact
        working-directory: plugin
        run: |
          if git diff --quiet -- src/bandage/bandage-layout.js; then
            echo "Rebuild matches the committed artifact byte for byte."
          else
            committed=$(git show HEAD:src/bandage/bandage-layout.js | wc -c)
            rebuilt=$(wc -c < src/bandage/bandage-layout.js)
            echo "::notice::Rebuilt engine differs from committed \
            (committed ${committed} bytes, rebuilt ${rebuilt} bytes). \
            Expected when the toolchain or sources moved; download the artifact \
            below and commit it if the change is intended."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandage-layout.js
          path: plugin/src/bandage/bandage-layout.js
